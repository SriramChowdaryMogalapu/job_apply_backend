name: 8:00 AM Telegram Digest
env:
   TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
   TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
   DATABASE_URL: ${{ secrets.DATABASE_URL }}
   FRONTEND_URL: ${{ secrets.FRONTEND_URL }} # if used

on:
  workflow_run:
    workflows: ["Daily Job Harvest"]
    types:
      - completed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Print Daily Job Harvest workflow status
        run: |
          echo "First workflow status: ${{ github.event.workflow_run.conclusion }}"

      - name: Run only if Daily Job Harvest workflow succeeded
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: echo "First workflow succeeded!"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install httpx asyncpg

      - name: Send Digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/telegram_dispatcher.py --send